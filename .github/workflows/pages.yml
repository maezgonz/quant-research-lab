name: Pages — Real Estate Report

on:
  push:
    branches: [main]
    paths:
      - "src/real_estate/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC — refresh report with live UVA/CCL/RIPTE
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy matplotlib scipy requests urllib3
      - name: Generate report
        run: python src/real_estate/dashboard_re_v2.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/real_estate/reports
      - id: deploy
        uses: actions/deploy-pages@v4
